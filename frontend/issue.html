<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue — FLUX Review Search</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,200;0,400;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Lora:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="/" class="logo-link">
        <h1 class="logo">FLUX Review Search</h1>
      </a>
    </header>

    <main>
      <div id="issue-loading" class="loading">
        <div class="spinner"></div>
      </div>

      <div id="issue-page" hidden>
        <div class="issue-header">
          <div class="issue-nav-top">
            <a id="prev-link" href="#" class="nav-link" hidden>&larr; Prev</a>
            <span id="issue-meta" class="issue-meta-line"></span>
            <a id="next-link" href="#" class="nav-link" hidden>Next &rarr;</a>
          </div>
          <div id="issue-number-hero" class="issue-number-hero"></div>
          <h1 id="issue-title" class="issue-page-title"></h1>
          <blockquote id="issue-quote" class="issue-page-quote" hidden></blockquote>
        </div>

        <div class="issue-body-grid">
          <div class="issue-body-main">
            <nav id="section-nav" class="section-nav"></nav>
            <div id="issue-topics-mobile" class="issue-topics-mobile-host" hidden></div>
            <div id="section-content" class="section-content"></div>
            <div id="issue-related-mobile" class="issue-topics-mobile-host" hidden></div>
            <div class="issue-footer-actions">
              <a id="substack-link" href="#" target="_blank" rel="noopener" class="btn-secondary">Read on Substack</a>
            </div>
          </div>
          <div id="issue-topics-side" class="issue-topics-side-host" hidden></div>
        </div>
      </div>

      <div id="issue-error" class="empty-state" hidden>
        <p>Issue not found.</p>
        <a href="/">Back to search</a>
      </div>
    </main>

    <footer class="footer">
      <p>Searching the complete archive of <a href="https://read.fluxcollective.org" target="_blank" rel="noopener">The FLUX Review</a></p>
      <p class="footer-built"><a href="https://developers.cloudflare.com/" target="_blank" rel="noopener">Built on the Cloudflare Developer Platform</a></p>
    </footer>
  </div>

  <script type="module" src="/js/issue-page.js"></script>
  <script type="module">
    // Load marked + DOMPurify from CDN asynchronously — the page renders
    // immediately with the built-in escaping fallback in issue-page.js.
    // Both must arrive before marked is used: marked passes raw HTML through,
    // so its output is only safe once DOMPurify can sanitize it. DOMPurify is
    // assigned first so the renderer's marked-&&-DOMPurify guard never sees
    // marked alone.
    Promise.all([
      import('https://cdn.jsdelivr.net/npm/marked@18/lib/marked.esm.js'),
      import('https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.es.mjs'),
    ])
      .then(function (mods) {
        mods[0].marked.setOptions({ breaks: false, gfm: true, silent: true });
        window.DOMPurify = mods[1].default;
        window.marked = mods[0].marked;
      })
      .catch(function () { /* degrade gracefully — built-in fallback handles it */ });
  </script>
</body>
</html>
