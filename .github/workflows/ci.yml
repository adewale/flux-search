name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 is required for the built-in node:sqlite module that
          # test/helpers-d1.ts uses in place of better-sqlite3 (no native
          # build, no extra dependency). Stable LTS as of 2024-10.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run corpus:process
      - run: npm test
      - run: npm run typecheck
