name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22.16+ supplies node:sqlite column metadata for the shared
          # D1 test adapter (no native build or extra dependency).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      # Offline tests use existing corpus fixtures; live checks remain opt-in.
      - run: npm test
      - run: npm run typecheck
