name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 is required for the built-in node:sqlite module that
          # test/helpers-d1.ts uses in place of better-sqlite3 (no native
          # build, no extra dependency). Stable LTS as of 2024-10.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Post failure tail to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test-output.log', 'utf-8');
            const lines = log.split('\n');
            const tail = lines.slice(-200).join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '<details><summary>CI test output (tail)</summary>\n\n```\n' + tail + '\n```\n\n</details>',
            });
