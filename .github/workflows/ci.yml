name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 22.16+ supplies node:sqlite column metadata for the shared
          # D1 test adapter (no native build or extra dependency).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      # Offline tests use existing corpus fixtures; live checks remain opt-in.
      - run: npm test
      - run: npm run typecheck
      - name: Install browser for rendered layout contracts
        run: npx playwright install --with-deps chromium
      - name: Check article and topics rail in the local Worker
        run: PLAYWRIGHT_WEB_SERVER=wrangler npx playwright test e2e/issue-rail-layout.spec.ts --project=desktop
