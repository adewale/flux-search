name: Live checks

# Response invariants, relevance and topic-quality checks against the
# deployed Worker (test/live/). Deploys are manual, so this runs on a
# schedule and on demand instead of on PRs. Read-only GET requests.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      search_url:
        description: Deployment to check
        required: true
        default: https://flux-search.adewale-883.workers.dev

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          SEARCH_URL: ${{ inputs.search_url || 'https://flux-search.adewale-883.workers.dev' }}
