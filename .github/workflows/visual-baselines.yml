name: Visual baselines

# Renders Linux screenshot baselines on the same image CI compares on, and
# uploads them for review. It never commits: download the artifact, inspect
# the PNGs, and commit them to e2e/visual-regression.spec.ts-snapshots/ in a
# normal PR. Run it after an intentional UI change, or once to bootstrap.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04  # must match the e2e job in ci.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render Linux baselines
        run: npm run test:visual:local -- --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: e2e/visual-regression.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
